post:
  summary: Принять предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: integer
              format: int64
              example: 1
            toUserId:
              type: integer
              format: int64
              example: 2
  responses:
    '200':
      description: Предложение дружбы принято
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
            properties:
              id:
                type: integer
                format: int64
                example: 10
              fromUserId:
                type: integer
                format: int64
                example: 1
              toUserId:
                type: integer
                format: int64
                example: 2
              status:
                type: string
                enum: [ PENDING, ACCEPTED, REJECTED ]
                example: ACCEPTED
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
    '204':
      description: Предложение уже принято
    '400':
      description: Некорректные входные данные
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_INPUT_DATA
              message:
                type: string
                example: Некорректные входные данные
    '404':
      description: Пользователь или заявка не найдены
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь или заявка с указанным ID не найден
    '409':
      description: Предложение дружбы уже отклонено
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: OFFER_FRIENDSHIP_ALREADY_REJECTED
              message:
                type: string
                example: Отклонённое предложение дружбы нельзя принять
