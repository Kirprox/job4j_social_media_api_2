get:
  summary: Получить список входящих предложений в друзья
  responses:
      '200':
        description: получен список входящих предложений дружбы
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - id
                  - fromUserId
                  - toUserId
                properties:
                  id:
                    type: integer
                    format: int64
                    description: ID предложения дружбы
                    example: 10
                  fromUserId:
                    type: integer
                    format: int64
                    description: ID отправителя предложения дружбы
                    example: 1
                  toUserId:
                    type: integer
                    format: int64
                    description: ID получателя предложения дружбы
                    example: 2

